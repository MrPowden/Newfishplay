<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FISHPLAY — Season 2</title>
<style>
:root{
  --bg:#05090d; --text:#f2f4f5; --muted:#6f7a82; --line:rgba(255,255,255,.14); --acc:#ff5b2e;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --bg:#05090d; --text:#f2f4f5; } }
:root[data-theme="dark"]{ --bg:#05090d; --text:#f2f4f5; }
html{ scroll-padding-top:env(safe-area-inset-top,0px); }
html,body{ height:100%; margin:0; }
body{
  background:var(--bg); color:var(--text); overflow:hidden;
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Helvetica Neue","Segoe UI",Roboto,Arial,sans-serif;
  -webkit-font-smoothing:antialiased;
}
.wrap{
  position:relative; z-index:2; height:100%; box-sizing:border-box;
  padding:clamp(20px,4vw,48px); display:flex; flex-direction:column; justify-content:space-between;
}
header{ display:flex; justify-content:space-between; align-items:baseline; font-size:13px; letter-spacing:.14em; animation:in 1s .1s both; }
header b{ font-weight:700; letter-spacing:.2em; }
header span{ color:var(--muted); }
.hero{ max-width:min(760px,100%); }
.eyebrow{ display:flex; align-items:center; gap:10px; font-size:12px; letter-spacing:.32em; color:var(--muted); font-weight:600; animation:in 1s .3s both; }
.eyebrow i{ width:6px; height:6px; border-radius:50%; background:var(--acc); animation:blink 1.8s infinite; }
h1{
  margin:16px 0 0; font-weight:650; letter-spacing:-.055em; line-height:.92;
  font-size:clamp(60px,14vw,190px);
}
h1 .mask{ display:block; overflow:hidden; padding-bottom:.06em; }
h1 .mask > span{ display:block; transform:translateY(105%); animation:rise 1.2s cubic-bezier(.2,.8,.2,1) .5s forwards; }
h1 em{ font-style:normal; color:var(--acc); }
.lead{ margin:22px 0 0; max-width:30ch; color:var(--muted); font-size:clamp(15px,2.2vw,20px); line-height:1.4; animation:in 1s 1s both; }
.timer{ display:flex; align-items:flex-start; gap:clamp(6px,1.6vw,18px); margin-top:clamp(24px,5vh,48px); animation:in 1s 1.2s both; }
.u{ min-width:1.6ch; }
.n{ display:block; font-size:clamp(38px,9vw,96px); font-weight:300; letter-spacing:-.04em; line-height:1; font-variant-numeric:tabular-nums; }
.n.t{ animation:tick .5s ease; }
.l{ display:block; margin-top:8px; font-size:10px; letter-spacing:.24em; color:var(--muted); font-weight:600; }
.c{ font-size:clamp(38px,9vw,96px); font-weight:200; line-height:1; color:var(--line); }
footer{ animation:in 1s 1.4s both; }
.bar{ position:relative; height:1px; background:var(--line); }
.bar i{ position:absolute; left:0; top:-1px; height:3px; width:0; background:var(--acc); transition:width 1.6s cubic-bezier(.2,.8,.2,1); }
.meta{ display:flex; justify-content:space-between; margin-top:12px; font-size:11px; letter-spacing:.2em; color:var(--muted); font-weight:600; }

.scene{ position:absolute; z-index:1; right:3%; top:50%; transform:translateY(-50%); width:clamp(300px,54vw,820px); pointer-events:none; }
.scene svg{ display:block; width:100%; overflow:visible; }
.fish{ animation:bob 6s ease-in-out infinite; transform-box:fill-box; }
.fish path{ fill:none; stroke:var(--text); stroke-width:1.5; stroke-linecap:round; stroke-linejoin:round; stroke-dasharray:1; stroke-dashoffset:1; animation:draw 2.6s cubic-bezier(.5,0,.2,1) forwards; }
.fish .body{ fill:rgba(255,255,255,.035); animation:draw 2.6s cubic-bezier(.5,0,.2,1) forwards, fillin 2s 2s both; }
.eye{ fill:var(--acc); opacity:0; animation:in .8s 2.4s forwards; }
.rip{ fill:none; stroke:var(--text); stroke-width:1; }

@keyframes in{ from{ opacity:0; transform:translateY(14px) } to{ opacity:1; transform:none } }
@keyframes rise{ to{ transform:none } }
@keyframes draw{ to{ stroke-dashoffset:0 } }
@keyframes fillin{ from{ fill:rgba(255,255,255,0) } }
@keyframes bob{ 50%{ transform:translateY(-10px) rotate(-1.2deg) } }
@keyframes blink{ 50%{ opacity:.2 } }
@keyframes tick{ from{ opacity:.35; transform:translateY(-6px) } to{ opacity:1; transform:none } }
@media (max-width:700px){
  .scene{ right:-8%; top:30%; width:112vw; opacity:.5; }
}
@media (prefers-reduced-motion: reduce){ *{ animation-duration:.01s !important; animation-delay:0s !important } }
</style>
</head>
<body>
<div class="scene" aria-hidden="true">
  <svg viewBox="0 0 400 200">
    <g id="rings"></g>
    <g class="fish">
      <path class="body" pathLength="1" d="M30 100 C80 28 240 14 320 100 C240 186 80 172 30 100 Z"/>
      <path pathLength="1" style="animation-delay:.5s" d="M316 100 C340 84 360 62 386 42 C372 76 372 124 386 158 C360 138 340 116 316 100 Z"/>
      <path pathLength="1" style="animation-delay:.9s" d="M150 38 C170 6 214 0 238 30"/>
      <path pathLength="1" style="animation-delay:1s" d="M170 162 C186 186 214 192 232 170"/>
      <path pathLength="1" style="animation-delay:1.2s" d="M96 66 C112 88 112 112 96 134"/>
      <path pathLength="1" style="animation-delay:1.4s" d="M170 70 C190 90 190 110 170 130"/>
      <path pathLength="1" style="animation-delay:1.55s" d="M210 62 C232 86 232 114 210 138"/>
      <path pathLength="1" style="animation-delay:1.7s" d="M250 66 C266 86 266 114 250 134"/>
      <circle class="eye" cx="66" cy="90" r="5"/>
    </g>
  </svg>
</div>

<div class="wrap">
  <header><div><b>FISHPLAY</b> <span>GAME BOT</span></div><span>17.10.2026</span></header>

  <section class="hero">
    <div class="eyebrow" id="eb"><i></i>СКОРО</div>
    <h1><span class="mask"><span>Season <em>2</em></span></span></h1>
    <p class="lead">Новый сезон начнётся 17 октября. Готовь снасти.</p>
    <div class="timer" id="timer">
      <div class="u"><span class="n" data-k="d">00</span><span class="l">ДНЕЙ</span></div><span class="c">:</span>
      <div class="u"><span class="n" data-k="h">00</span><span class="l">ЧАСОВ</span></div><span class="c">:</span>
      <div class="u"><span class="n" data-k="m">00</span><span class="l">МИНУТ</span></div><span class="c">:</span>
      <div class="u"><span class="n" data-k="s">00</span><span class="l">СЕКУНД</span></div>
    </div>
  </section>

  <footer>
    <div class="bar"><i id="prog"></i></div>
    <div class="meta"><span>30.09</span><span>17.10</span></div>
  </footer>
</div>

<script>
// ripples on water surface (SMIL)
var g=document.getElementById('rings'),NS='http://www.w3.org/2000/svg';
for(var i=0;i<4;i++){
  var e=document.createElementNS(NS,'ellipse');
  e.setAttribute('class','rip'); e.setAttribute('cx',200); e.setAttribute('cy',108);
  var b=(i*2)+'s';
  [['rx',0,620],['ry',0,150],['stroke-opacity',.35,0]].forEach(function(a){
    var m=document.createElementNS(NS,'animate');
    m.setAttribute('attributeName',a[0]); m.setAttribute('from',a[1]); m.setAttribute('to',a[2]);
    m.setAttribute('dur','8s'); m.setAttribute('begin',b); m.setAttribute('repeatCount','indefinite');
    e.appendChild(m);
  });
  g.appendChild(e);
}

// countdown
var target=new Date(2026,9,17,0,0,0).getTime(), start=new Date(2026,8,30,0,0,0).getTime(), els={};
document.querySelectorAll('.n').forEach(function(x){els[x.dataset.k]=x;});
function pad(n){return n<10?'0'+n:''+n;}
function set(k,v){var x=els[k]; if(x.textContent!==v){x.textContent=v; x.classList.remove('t'); void x.offsetWidth; x.classList.add('t');}}
function update(){
  var diff=target-Date.now();
  if(diff<=0){
    document.getElementById('eb').innerHTML='<i></i>УЖЕ ЗДЕСЬ';
    document.getElementById('timer').style.display='none';
    document.getElementById('prog').style.width='100%'; return;
  }
  var s=Math.floor(diff/1000);
  set('d',pad(Math.floor(s/86400))); set('h',pad(Math.floor(s%86400/3600)));
  set('m',pad(Math.floor(s%3600/60))); set('s',pad(s%60));
  document.getElementById('prog').style.width=Math.min(100,Math.max(0,(Date.now()-start)/(target-start)*100))+'%';
  setTimeout(update,1000-Date.now()%1000);
}
update();
</script>
</body>
</html>
